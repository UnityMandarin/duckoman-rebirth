name: Validate and deploy Duckoman Rebirth

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in Assets ProjectSettings Release DuckomanHTML5 TemplateData scripts BASELINE.md VALIDATION.md ASSET_PROVENANCE.md; do
            if [ -e "$path" ]; then
              echo "Forbidden legacy path remains: $path" >&2
              exit 1
            fi
          done
          if find . -path './.git' -prune -o -type f \( -name '*.meta' -o -name '*.cs' -o -name '*.unity' -o -name '*.prefab' -o -name '*.anim' -o -name '*.controller' -o -name '*.asset' -o -name '*.physicsMaterial2D' -o -name '*.jsgz' -o -name '*.datagz' -o -name '*.memgz' \) -print -quit | grep -q .; then
            echo "Forbidden Unity artifact remains" >&2
            exit 1
          fi
          test -f index.html
          test -f LICENSE
          test -f NOTICE.md
          test "$(find assets/original -type f -name '*.png' | wc -l | tr -d ' ')" = 23
          grep -q 'Original hosted game' NOTICE.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
